<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGI Labs - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px 20px; 
        }

        /* --- BOTÃO ÁREA RESTRITA --- */
        .btn-restrito {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #004d61;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }

        .btn-restrito:hover {
            background-color: #003645;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }

        header {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin-top: 40px; 
        }

        .container-projetos {
            background-color: rgba(0, 77, 97, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 77, 97, 0.25), 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            z-index: 1;
            margin-top: 20px; 
        }

        .container-projetos h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card-link {
            background-color: #ffffff;
            color: #004d61;
            text-decoration: none;
            padding: 30px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 2.5rem;
        }

        footer {
            margin-top: 30px; 
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .footer-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .footer-logo {
            height: 45px; 
            width: auto;
            display: block;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .footer-logo:hover {
            opacity: 1;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
        }
        
        @media (max-width: 600px) {
            .btn-restrito {
                top: 10px;
                right: 10px;
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }

        /* --- ESTILOS DO MODAL DE SENHA --- */
        .modal-overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-box h2 {
            color: #004d61;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #004d61;
        }

        .modal-botoes {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .btn-cancelar {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-cancelar:hover {
            background-color: #cbd5e1;
        }

        .btn-entrar {
            background-color: #004d61;
            color: #fff;
        }

        .btn-entrar:hover {
            background-color: #003645;
        }
        
        .erro-senha {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none; /* Escondido por padrão */
        }
    </style>
</head>
<body>

    <!-- Janela Modal de Senha -->
    <div class="modal-overlay" id="modalSenha">
        <div class="modal-box">
            <h2>🔒 Área Restrita</h2>
            <p style="color: #64748b; margin-bottom: 15px; font-size: 0.9rem;">Insira a senha de acesso:</p>
            
            <!-- type="password" é o que esconde a senha -->
            <input type="password" id="inputSenha" placeholder="••••••••" onkeypress="verificarEnter(event)">
            
            <p class="erro-senha" id="msgErro">Senha incorreta. Tente novamente.</p>

            <div class="modal-botoes">
                <button class="modal-btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="modal-btn btn-entrar" onclick="verificarSenha()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Botão que abre o modal -->
    <button class="btn-restrito" onclick="abrirModal()">🔒 Área Restrita</button>

    <header>
        <img src="https://i.ibb.co/tMYkXHps/Chat-GPT-Image-19-de-mai-de-2026-11-06-18-Photoroom-1.png" alt="NGI Labs Logo" class="logo">
    </header>

    <main class="container-projetos">
        <h1>Projetos</h1>
         
        <div class="grid-links">
            <a href="https://larbac90.github.io/simulador/" class="card-link">
                <span class="icon">🪙</span>
                <span>ContraCHECK</span>
            </a>

            <a href="simupai.html" class="card-link">
                <span class="icon">💸</span>
                <span>Simulador de Aposentadoria(PLACEHOLDER)</span>
            </a>

            <a href="simupai.html" class="card-link">
                <span class="icon">💸</span>
                <span>SimuPAI</span>
            </a>
            
            <a href="calcdata.html" class="card-link">
                <span class="icon">📅</span>
                <span>CalcData</span>
            </a>

            <a href="calendario.html" class="card-link">
                <span class="icon">☑️</span>
                <span>Calendário DGF</span>
            </a>

            <a href="simusaude.html" class="card-link">
                <span class="icon">🏥</span>
                <span>Simulador Aux. Saúde</span>
            </a>

            <a href="https://drive.google.com/file/d/1DvvFcZNtRu1w9sGBYhRnQv4-UisYZzPl/view?usp=sharing" class="card-link">
                <span class="icon">⏬</span>
                <span>Download<br>PSAL 1994 - 1998</span>
            </a> 
        </div>
    </main>

    <footer>
        <div class="footer-logos">
            <img src="https://i.ibb.co/FkLCjrFV/Capturar-removebg-preview-1.png" class="footer-logo" alt="Logo 1"> 
            <img src="https://i.ibb.co/yc32bwv5/Logo-DGF-upscaled-Photoroom.png" class="footer-logo" alt="Logo DGF">
        </div>
        <div class="footer-text">DGF • NUGOV • TJPE</div>
    </footer>

    <!-- Script de validação da senha -->
    <script>
        const modal = document.getElementById('modalSenha');
        const input = document.getElementById('inputSenha');
        const msgErro = document.getElementById('msgErro');

        function abrirModal() {
            modal.style.display = 'flex';
            input.value = ''; // Limpa o campo ao abrir
            msgErro.style.display = 'none'; // Esconde mensagem de erro antiga
            setTimeout(() => input.focus(), 100); // Foca no campo automaticamente
        }

        function fecharModal() {
            modal.style.display = 'none';
        }

        function verificarSenha() {
            const senhaDigitada = input.value;
            
            // Defina sua senha aqui
            if (senhaDigitada === "ngilabsdgf") { 
                // Coloque o link da sua área restrita aqui
                window.location.href = "hml.html"; 
            } else {
                // Mostra a mensagem de erro
                msgErro.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }

        // Permite apertar a tecla "Enter" para enviar a senha
        function verificarEnter(event) {
            if (event.key === 'Enter') {
                verificarSenha();
            }
        }
    </script>
</body>
</html>
