<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGI Labs - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px 20px;
        }

        /* --- BOTÃO ÁREA RESTRITA --- */
        .btn-restrito {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #004d61;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }

        .btn-restrito:hover {
            background-color: #003645;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }

        header {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin-top: 40px;
        }

        .container-projetos {
            background-color: rgba(0, 77, 97, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 77, 97, 0.25), 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            z-index: 1;
            margin-top: 20px; 
        }

        .container-projetos h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* --- WRAPPER PARA O SUBMENU --- */
        .card-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card-wrapper .card-link {
            height: 100%;
            width: 100%;
        }

        .card-link {
            background-color: #ffffff;
            color: #004d61;
            text-decoration: none;
            padding: 30px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 2.5rem;
        }

        /* --- ESTILOS DO MENU SUSPENSO (DROPDOWN) --- */
        .submenu {
            display: none;
            position: absolute;
            top: calc(100% + 10px); /* Fica 10px abaixo do card principal */
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            flex-direction: column;
            overflow: hidden;
            z-index: 20;
        }

        .submenu.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        .submenu a {
            padding: 12px 15px;
            text-decoration: none;
            color: #004d61;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submenu a:last-child {
            border-bottom: none;
        }

        .submenu a:hover {
            background-color: #f0f7f9;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 30px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .footer-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .footer-logo {
            height: 45px;
            width: auto;
            display: block;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .footer-logo:hover {
            opacity: 1;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
        }
        
        @media (max-width: 600px) {
            .btn-restrito {
                top: 10px;
                right: 10px;
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <button class="btn-restrito" onclick="acessarAreaRestrita()">🔒 Área Restrita</button>

    <header>
        <img src="https://i.ibb.co/tMYkXHps/Chat-GPT-Image-19-de-mai-de-2026-11-06-18-Photoroom-1.png" alt="NGI Labs Logo" class="logo">
    </header>

    <main class="container-projetos">
        <h1>Projetos</h1>
         
        <div class="grid-links">           
            <a href="organomaker.html" class="card-link">
                <span class="icon">🧑‍💼</span>
                <span>Organomaker</span>
            </a>

            <a href="fluxomaker.html" class="card-link">
                <span class="icon">⚙️</span>
                <span>Fluxomaker</span>
            </a>       

            <!-- Novo Botão Dashboards com Submenu -->
            <div class="card-wrapper">
                <a href="#" class="card-link" onclick="toggleSubmenu(event, 'submenu-dash')">
                    <span class="icon">📶</span>
                    <span>Dashboards</span>
                </a>
                
                <div id="submenu-dash" class="submenu">
                    <a href="dash1.html">📊 Dashboard 1</a>
                    <a href="dash2.html">📈 Dashboard 2</a>
                    <a href="dash3.html">📑 Dashboard 3</a>
                </div>
            </div>

            <a href="https://drive.google.com/file/d/1DvvFcZNtRu1w9sGBYhRnQv4-UisYZzPl/view?usp=sharing" class="card-link" target="_blank">
                <span class="icon">⏬</span>
                <span>Download<br>PSAL 1994 - 1998</span>
            </a> 
        </div>
    </main>

    <footer>
        <div class="footer-logos">
            <img src="https://i.ibb.co/FkLCjrFV/Capturar-removebg-preview-1.png" class="footer-logo" alt="Logo 1"> 
            <img src="https://i.ibb.co/yc32bwv5/Logo-DGF-upscaled-Photoroom.png" class="footer-logo" alt="Logo DGF">
        </div>
        <div class="footer-text">DGF • NUGOV • TJPE</div>
    </footer>

    <script>
        function acessarAreaRestrita() {
            alert("Redirecionando para a Área Restrita...");
        }

        // Função para abrir/fechar o submenu de dashboards
        function toggleSubmenu(event, submenuId) {
            event.preventDefault(); // Impede a página de pular pro topo ao clicar
            const submenu = document.getElementById(submenuId);
            
            if (submenu.classList.contains('active')) {
                submenu.classList.remove('active');
            } else {
                // Fecha outros menus se houver, e abre este
                document.querySelectorAll('.submenu').forEach(menu => menu.classList.remove('active'));
                submenu.classList.add('active');
            }
        }

        // Fecha o menu automaticamente se clicar fora da caixinha
        document.addEventListener('click', function(event) {
            const isClickInside = event.target.closest('.card-wrapper');
            if (!isClickInside) {
                document.querySelectorAll('.submenu').forEach(menu => menu.classList.remove('active'));
            }
        });
    </script>
</body>
</html>
